<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ FLOWERZ | Premium Music Experience</title>
  <link rel="canonical" href="https://djflowerz.co.ke" />
  <!-- Content Security Policy: allows trusted origins for scripts, styles, media, and frames -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://js.paystack.co https://api.paystack.co https://www.googletagmanager.com https://fonts.googleapis.com https://*.hearthis.at https://hearthis.at https://*.soundcloud.com https://*.mixcloud.com https://www.youtube.com;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.hearthis.at https://hearthis.at;
    font-src 'self' data: https://fonts.gstatic.com;
    img-src 'self' data: blob: https: http:;
    media-src 'self' blob: https: https://cdn.vicknickvideopool.com https://r2.vicknickvideopool.com https://djflowerz-worker.ianmuriithiflowerz.workers.dev https://*.hearthis.at https://hearthis.at https://*.soundcloud.com;
    connect-src 'self' https://djflowerz-worker.ianmuriithiflowerz.workers.dev https://api.paystack.co https://checkout.paystack.com https://*.supabase.co wss://*.supabase.co https://cdn.vicknickvideopool.com https://r2.vicknickvideopool.com https://*.hearthis.at https://hearthis.at https://*.soundcloud.com https://*.mixcloud.com;
    frame-src 'self' https: https://*.youtube.com https://youtube.com https://checkout.paystack.com https://*.hearthis.at https://hearthis.at https://*.soundcloud.com https://soundcloud.com https://*.mixcloud.com https://mixcloud.com;
    worker-src 'self' blob:;
    object-src 'none';
  " />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://js.paystack.co/v1/inline.js" id="paystack-script"></script>
  <script>
    // Verification to catch adblockers blocking the Paystack script
    window.addEventListener('load', function () {
      if (!window.PaystackPop) {
        console.warn('Paystack script failed to load. Checkout may be disabled.');
      }
    });
  </script>
  <style>
    body {
      background-color: #0B0B0F;
      color: #ffffff;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0B0B0F;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #7B5CFF;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .neon-text {
      text-shadow: 0 0 10px rgba(123, 92, 255, 0.5);
    }
  </style>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('root');
      if (el) {
        el.innerHTML = '<div style="color:#ff4444;font-family:monospace;padding:24px;background:#0b0b0f;min-height:100vh;white-space:pre-wrap"><h2>⚠️ App Crash Detected</h2><p>' + msg + '</p><p>' + src + ':' + line + ':' + col + '</p><p>' + (err && err.stack ? err.stack : '') + '</p></div>';
      }
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('root');
      if (el && !el.children.length) {
        el.innerHTML = '<div style="color:#ff4444;font-family:monospace;padding:24px;background:#0b0b0f;min-height:100vh;white-space:pre-wrap"><h2>⚠️ Unhandled Promise Rejection</h2><p>' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) + '</p></div>';
      }
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
