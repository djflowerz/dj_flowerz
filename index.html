  <style>
    body {
      background-color: #0B0B0F;
      color: #ffffff;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #0B0B0F;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #7B5CFF;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .neon-text {
      text-shadow: 0 0 10px rgba(123, 92, 255, 0.5);
    }
    
    /* Preloader Styles */
    #preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0B0B0F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    .loader-ring {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(123, 92, 255, 0.1);
      border-top-color: #7B5CFF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loader-text {
      margin-top: 20px;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.3);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }
  </style>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('root');
      if (el) {
        el.innerHTML = '<div style="color:#ff4444;font-family:monospace;padding:24px;background:#0b0b0f;min-height:100vh;white-space:pre-wrap"><h2>⚠️ App Crash Detected</h2><p>' + msg + '</p><p>' + src + ':' + line + ':' + col + '</p><p>' + (err && err.stack ? err.stack : '') + '</p></div>';
      }
      return false;
    };
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('root');
      if (el && !el.children.length) {
        el.innerHTML = '<div style="color:#ff4444;font-family:monospace;padding:24px;background:#0b0b0f;min-height:100vh;white-space:pre-wrap"><h2>⚠️ Unhandled Promise Rejection</h2><p>' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) + '</p></div>';
      }
    });
  </script>
</head>

<body>
  <div id="root">
    <div id="preloader">
      <div class="loader-ring"></div>
      <div class="loader-text">Initializing Experience</div>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
