<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Video Pool</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root { --sidebar-width: 260px; }
html, body {
  margin:0;
  height:100%;
  background:#0b0b0b;
  color:#fff;
  font-family:system-ui;
  overflow:hidden;
}
.sidebar {
  position:fixed;
  top:0;
  left:0;
  width:var(--sidebar-width);
  height:100vh;
  background:#111;
  padding:20px;
  border-right:1px solid #222;
  overflow-y:auto;
  box-sizing:border-box;
  z-index:10;
}
.sidebar select {
  width:100%;
  padding:10px;
  margin-bottom:12px;
  border-radius:6px;
  border:none;
}
.content {
  margin-left:var(--sidebar-width);
  height:100vh;
  overflow-y:auto;
  padding:20px;
  box-sizing:border-box;
}
h1 { text-align:center; margin-bottom:20px; }
.search { max-width:420px; margin:0 auto 20px; display:block; padding:12px; border-radius:6px; border:none; }
.track { background:#151515; border-radius:8px; padding:12px; margin-bottom:12px; transition:.2s; }
.title { font-weight:bold; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.badge { background:#1e90ff; font-size:10px; padding:2px 6px; border-radius:4px; }
.meta { font-size:12px; opacity:.7; margin-bottom:6px; }
.versions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
button.play, button.download, button.downloadAll {
  background:#1e90ff;
  color:#fff;
  border:none;
  padding:6px 10px;
  border-radius:5px;
  cursor:pointer;
  font-weight:bold;
}
button.downloadAll { background:#ff9800; }
.player video, .player audio {
  width:100%;
  max-width:360px;
  margin-top:8px;
}
.pagination {
  text-align:center;
  margin:20px 0;
  font-size:13px;
  opacity:.8;
}
.pagination button {
  background:#1e90ff;
  border:none;
  color:#fff;
  padding:6px 10px;
  margin:0 6px;
  border-radius:5px;
  cursor:pointer;
}
.pagination button:disabled {
  opacity:.4;
  cursor:not-allowed;
}
</style>
</head>
<body>

<div class="sidebar">
  <select id="yearFilter">
    <option value="">Select Folder</option>
  </select>
  <select id="monthFilter" disabled>
    <option value="">Select Subfolder</option>
  </select>
</div>

<div class="content">
  <h1>New Releases · Old Releases · Genre Sorted Music</h1>
  <input id="search" class="search" placeholder="Search tracks…" />
  <div id="list"></div>
  <div class="pagination">
    <span id="pageInfo"></span><br>
    <button id="prevBtn">Prev</button>
    <button id="nextBtn">Next</button>
  </div>
</div>
